version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: s3clone-postgres
    environment:
      POSTGRES_DB: s3clone
      POSTGRES_USER: s3user
      POSTGRES_PASSWORD: s3password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U s3user -d s3clone"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: s3clone-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/s3clone
      SPRING_DATASOURCE_USERNAME: s3user
      SPRING_DATASOURCE_PASSWORD: s3password
    ports:
      - "8080:8080"
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
