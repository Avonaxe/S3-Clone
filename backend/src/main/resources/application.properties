spring.application.name=s3-clone-backend

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/s3clone
spring.datasource.username=s3user
spring.datasource.password=s3password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=8080

# JWT Configuration
jwt.secret=MySuperSecretKeyForS3CloneMVPWhichMustBeAtLeast32BytesLong!!
jwt.expiration=86400000
